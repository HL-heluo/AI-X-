# ⚠️ 本文件必须保持纯 ASCII。
#
# 原因和 alembic.ini 一样：这些 .ini/.cfg 是被 configparser 之类按
# **系统区域编码**读的，而这台机器是中文 Windows（GBK）。写中文进去
# 会让工具在读配置阶段就抛 UnicodeDecodeError，报错位置和病因完全无关。
# 中文说明写进 tests/conftest.py —— Python 源码按 UTF-8 读，安全。

[pytest]
testpaths = tests

# 【为什么是 auto】因为整套契约测试都是 async 的（httpx 0.28 的
# ASGITransport 只有异步接口）。auto 模式下 async def 用例自动被
# 当成异步跑，不用每条都挂 @pytest.mark.asyncio。
#
# 【为什么不选 strict】strict 要每条手写标记，漏一条的表现是
# **用例被静默跳过**——报告是绿的，但它根本没跑。
asyncio_mode = auto

# 【为什么要显式指定 event loop 作用域】默认的 function 作用域下，
# 每个用例建一个新 loop。B5 的 worker 测试需要跨用例共享一个 loop
# 才能测「后台任务真的在跑」，那时再改会牵动一批用例的写法。
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --strict-config
    -p no:cacheprovider
# 【为什么关掉 cacheprovider】`.pytest_cache` 会跨分支保留上一次的
# 失败清单（`--lf` 用的）。做「守卫测试要故意改坏跑一遍」这类验证时，
# 残留的缓存会让「重跑上次失败的」跑到不该跑的用例上。
